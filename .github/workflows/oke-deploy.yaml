name: OKE Multi-Tenant Cluster Deployment

on:
  pull_request:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/scripts/**'
      - '.github/argocd/**'
      - '.github/config.sh'
      - '.github/workflows/oke-deploy.yaml'
  push:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/scripts/**'
      - '.github/argocd/**'
      - '.github/config.sh'
      - '.github/workflows/oke-deploy.yaml'

  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - plan_and_apply

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: oke-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # Job 1: OCI Infrastructure (VCN, OKE, etc.)
  # ============================================================
  oke-deploy:
    name: "OKE Provisioning - ${{ matrix.env }}"
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_CLOUD_TOKEN }}
      TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: tenant-a
            region: us-ashburn-1
            environment: oke-tenant-a
            working_dir: environments/tenant-a
            module_path: modules/oke
          - env: tenant-b
            region: us-ashburn-1
            environment: oke-tenant-b
            working_dir: environments/tenant-b
            module_path: modules/oke
    outputs:
      cluster_id_tenant-a:  ${{ steps.get_cluster_id.outputs.cluster_id_tenant-a }}
      nlb_public_ip_tenant-a: ${{ steps.get_cluster_id.outputs.nlb_public_ip_tenant-a }}
      infra_node_label_tenant-a: ${{ steps.get_cluster_id.outputs.infra_node_label_tenant-a }}
      infra_taint_tenant-a: ${{ steps.get_cluster_id.outputs.infra_taint_tenant-a }}
      cluster_id_tenant-b:  ${{ steps.get_cluster_id.outputs.cluster_id_tenant-b }}
      nlb_public_ip_tenant-b: ${{ steps.get_cluster_id.outputs.nlb_public_ip_tenant-b }}
      infra_node_label_tenant-b: ${{ steps.get_cluster_id.outputs.infra_node_label_tenant-b }}
      infra_taint_tenant-b: ${{ steps.get_cluster_id.outputs.infra_taint_tenant-b }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes in oke
        id: filter
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_INPUT_ACTION: ${{ github.event.inputs.action }}
        run: |
          ./.github/scripts/check_changes.sh ${{ matrix.working_dir }} ${{matrix.module_path}}

      - name: Setup Terraform
        if: |
          steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Cache Terraform Plugins
        if: |
          steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-plugin-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-plugin-

      - name: Debug - Verify Module Path
        if: |
          steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true'
        run: |
          echo "Current directory: $(pwd)"
          echo "Working directory: ${{ matrix.working_dir }}"
          echo "Module path check from ${{ matrix.working_dir }}:"
          cd ${{ matrix.working_dir }}
          echo "  pwd: $(pwd)"
          echo "  ../../modules exists: $(test -d ../../modules && echo 'YES' || echo 'NO')"
          echo "  ../../modules/oke exists: $(test -d ../../modules/oke && echo 'YES' || echo 'NO')"
          ls -la ../../modules/oke/

      - name: Terraform Init
        if: |
          steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true'
        working-directory: ${{ matrix.working_dir }}
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          for attempt in 1 2 3; do
            echo "Terraform init attempt ${attempt}/3"
            if terraform init -input=false; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "terraform init failed after 3 attempts"
              exit 1
            fi

            sleep $((attempt * 10))
          done

      - name: Terraform Plan
        if: |
          steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true'
        working-directory: ${{ matrix.working_dir }}
        run: terraform plan -no-color -input=false

      - name: Terraform Apply
        if: steps.filter.outputs.run_apply == 'true'
        working-directory: ${{ matrix.working_dir }}
        run: terraform apply -auto-approve -input=false

      - name: Export Cluster Info
        id: get_cluster_id
        if: steps.filter.outputs.run_apply == 'true'
        working-directory: ${{ matrix.working_dir }}
        run: |
          CLUSTER_ID=$(terraform output -raw cluster_id)
          NLB_PUBLIC_IP=$(terraform output -raw nlb_public_ip)
          INFRA_NODE_LABEL=$(terraform output -raw infra_node_label)
          INFRA_TAINT=$(terraform output -raw infra_taint)
          ENV="${{ matrix.env }}"

          echo "cluster_id_${ENV}=${CLUSTER_ID}"     >> $GITHUB_OUTPUT
          echo "nlb_public_ip_${ENV}=${NLB_PUBLIC_IP}" >> $GITHUB_OUTPUT
          echo "infra_node_label_${ENV}=${INFRA_NODE_LABEL}" >> $GITHUB_OUTPUT
          echo "infra_taint_${ENV}=${INFRA_TAINT}"   >> $GITHUB_OUTPUT

      - name: Job Summary
        if: always()
        run: |
          echo "## OCI Provisioning Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Env**: ${{ matrix.env }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ matrix.region }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster ID**: ${{ steps.get_cluster_id.outputs[format('cluster_id_{0}', matrix.env)] }}" >> $GITHUB_STEP_SUMMARY
          echo "- **NLB IP**: ${{ steps.get_cluster_id.outputs[format('nlb_public_ip_{0}', matrix.env)] }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Job 2: OCI and Kubernetes Configuration
  # ============================================================
  argocd-deploy:
    name: "Deploy ArgoCD & Bootstrap - ${{ matrix.env }}"
    needs: oke-deploy
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.oke-deploy.result == 'success' &&
      (needs.oke-deploy.outputs.cluster_id_tenant-a != '' ||
      needs.oke-deploy.outputs.cluster_id_tenant-b  != '')
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: tenant-a
            region: us-ashburn-1
            environment: oke-tenant-a
            working_dir: environments/tenant-a
            cluster_id_key: cluster_id_tenant-a
            nlb_public_ip_key: nlb_public_ip_tenant-a
            bootstrap_mode: full
          - env: tenant-b
            region: us-ashburn-1
            environment: oke-tenant-b
            working_dir: environments/tenant-b
            cluster_id_key: cluster_id_tenant-b
            nlb_public_ip_key: nlb_public_ip_tenant-b
            bootstrap_mode: tenant-b-bootstrap
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes in .github
        id: filter
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_INPUT_ACTION: ${{ github.event.inputs.action }}
        run: |
          ./.github/scripts/check_changes.sh ".github"

      - name: Install OCI CLI & kubectl
        if: |
          steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip
          pip3 --version || true
          pip3 install --upgrade oci-cli

      - name: Setup OCI credentials
        if: |
          steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true'
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          DEFAULT_REGION: ${{ vars.OCI_DEFAULT_REGION }}
        run: |
          ./.github/scripts/setup_oci_credentials.sh

      - name: Generate Kubeconfig
        if: |
          steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true'
        env:
          CLUSTER_ID: ${{ fromJson(toJson(needs.oke-deploy.outputs))[matrix.cluster_id_key] }}
          REGION: ${{ vars.OCI_REGION }}
        run: |
          ./.github/scripts/kubeconfig.sh

      - name: Setup TLS Secret
        if: |
          steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true'
        env:
          SECRETS_PRIVATE_KEY: ${{ secrets.TLS_KEY_PEM }}
          SECRETS_PUBLIC_KEY: ${{ secrets.TLS_CERT_PEM }}
        run: |
          ./.github/scripts/configure_tls_secret.sh

      - name : Install ArgoCD and Kubeseal Sealed Secrets
        if: |
          (steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true') &&
          matrix.bootstrap_mode == 'full'
        run: |
          ./.github/scripts/install.sh

      - name: Apply infra node taint
        if: |
          steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true'
        env:
          INFRA_NODE_LABEL: ${{ fromJson(toJson(needs.oke-deploy.outputs))[format('infra_node_label_{0}', matrix.env)] }}
          TAINT: ${{ fromJson(toJson(needs.oke-deploy.outputs))[format('infra_taint_{0}', matrix.env)] }}
        run: |
          ./.github/scripts/apply_infra_taint.sh

      - name: Start Argocd
        if: |
          (steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true') &&
          matrix.bootstrap_mode == 'full'
        run: |
          ./.github/scripts/argocd_start.sh

      - name: Check if ArgoCD is already configured
        id: check_configured
        if: |
          (steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true') &&
          matrix.bootstrap_mode == 'full'
        run: |
          set -euo pipefail
          SVC_TYPE=$(kubectl get svc argocd-server -n argocd -o jsonpath='{.spec.type}' 2>/dev/null || echo "None")
          if [[ "$SVC_TYPE" == "ClusterIP" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "ArgoCD is already configured (service is ClusterIP)"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "ArgoCD is not yet configured (service is $SVC_TYPE)"
          fi

      - name: Update ArgoCD Initial Admin Password
        if: |
          (steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true') &&
          matrix.bootstrap_mode == 'full' &&
          steps.check_configured.outputs.configured == 'false'
        env:
          NLB_PUBLIC_IP: ${{ fromJson(toJson(needs.oke-deploy.outputs))[matrix.nlb_public_ip_key] }}
          ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
        id: update_argocd_password
        run: |
          ./.github/scripts/argocd_updatepwd.sh

      - name : Argocd Configuration
        if: |
          (steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true') &&
          matrix.bootstrap_mode == 'full'
        run: |
          ./.github/scripts/argocd_sa_config.sh

      - name: Apply tenant-b bootstrap SA
        if: |
          (steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true') &&
          matrix.bootstrap_mode == 'tenant-b-bootstrap'
        run: |
          kubectl apply -f .github/argocd/config-tenant-b-bootstrap.yaml

      - name: Generate cluster registration manifest
        id: cluster_registration
        if: |
          steps.filter.outputs.run_apply == 'true' &&
          matrix.bootstrap_mode == 'tenant-b-bootstrap'
        env:
          TENANT_NAME: ${{ matrix.env }}
          OUTPUT_DIR: cluster-registration
        run: |
          ./.github/scripts/generate_cluster_registration.sh

      - name : Argocd Patching
        if: |
          (steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true') &&
          matrix.bootstrap_mode == 'full'
        run: |
          ./.github/scripts/argocd_patch.sh

      - name: K8s Setup Summary
        if: |
          success() &&
          (steps.filter.outputs.run_plan == 'true' ||
          steps.filter.outputs.run_apply == 'true')
        run: |
          echo "## Kubernetes Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ matrix.bootstrap_mode }}" == "full" ]]; then
            echo "✅ ArgoCD deployed successfully" >> $GITHUB_STEP_SUMMARY
            echo "✅ K8s RBAC configured" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Tenant-b bootstrap complete (no ArgoCD; managed by tenant-a)" >> $GITHUB_STEP_SUMMARY
            echo "✅ argocd-cluster-admin SA + cluster-admin binding applied" >> $GITHUB_STEP_SUMMARY
            echo "✅ Infra node taint applied" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload cluster registration artifact
        if: |
          always() &&
          matrix.bootstrap_mode == 'tenant-b-bootstrap' &&
          steps.cluster_registration.outputs.manifest != ''
        uses: actions/upload-artifact@v4
        with:
          name: cluster-registration-${{ matrix.env }}
          path: cluster-registration/cluster-secret.yaml
          retention-days: 1
          if-no-files-found: error

      - name: Checkout cluster-config repo
        if: matrix.bootstrap_mode == 'full'
        uses: actions/checkout@v4
        with:
          repository: schmhj/cluster-config
          ref: main
          token: ${{ secrets.GH_PAT_SECRET_ADMIN }}

      - name: Apply AppProjects App
        if: matrix.bootstrap_mode == 'full'
        run: kubectl apply -f bootstrap/prod/${{ matrix.env }}/appprojects-app.yaml

      - name: Apply Root App
        if: matrix.bootstrap_mode == 'full'
        run: kubectl apply -f bootstrap/prod/${{ matrix.env }}/root-app.yaml

      - name: Bootstrap Summary
        if: |
          success() &&
          matrix.bootstrap_mode == 'full'
        run: |
          echo "## ArgoCD Bootstrap Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅  AppProjects app deployed" >> $GITHUB_STEP_SUMMARY
          echo "✅  Root app deployed" >> $GITHUB_STEP_SUMMARY

      - name: Clean up
        if: always()
        run: |
          rm -rf ~/.kube
          rm -rf ~/.oci
