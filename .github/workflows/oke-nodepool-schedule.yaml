# DEPRECATED for scheduled runs — the in-cluster Kubernetes CronJob
# (apps/oci-autoscaler in the cluster-config repo) is now the source of
# truth for functional-pool autoscaling. This workflow is retained for
# manual workflow_dispatch only; use it as a fallback if the CronJob
# fails or for one-off ops. The schedule block below is intentionally
# commented out — do not uncomment without first removing the CronJob
# or you will get double-scaling.
name: OKE Node Pool Schedule (manual fallback)

on:
  # schedule:
  #   # Run every 15 minutes to evaluate local time.
  #   - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Manual scale action. With cron disabled, "auto" still works as a one-shot "what would the schedule do right now" trigger. "start"/"stop" scale the infra pool to its normal size or to 0.'
        required: true
        default: start
        type: choice
        options:
          - start
          - stop
          - auto

permissions:
  contents: read

concurrency:
  group: oke-nodepool-schedule-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scale-node-pool:
    name: "Scale node pool - ${{ matrix.region }}"
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_CLOUD_TOKEN }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_REGION: ${{ matrix.region }}
      DEFAULT_REGION: ${{ matrix.region }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: tenant-a
            region: us-ashburn-1
            environment: oke-tenant-a
            working_dir: environments/tenant-a
            timezone: America/New_York
            # `node_pool_id` is aliased to the infra pool (1 node). The
            # functional pool (3 OCPUs/16 GB) is not touched by this
            # fallback — use the in-cluster CronJob or OCI CLI directly.
            normal_size: 1
          - env: tenant-b
            region: us-ashburn-1
            environment: oke-tenant-b
            working_dir: environments/tenant-b
            timezone: America/New_York
            normal_size: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine scale action
        id: action
        env:
          REQUESTED_ACTION: ${{ github.event.inputs.action }}
          TIME_ZONE: ${{ matrix.timezone }}
        run: |
          set -euo pipefail

          action="${REQUESTED_ACTION:-auto}"
          utc_time="$(date -u +%H:%M)"
          local_time="$(TZ="$TIME_ZONE" date +%H:%M)"
          local_hour="${local_time%%:*}"

          if [[ "$action" == "auto" ]]; then
            if (( 10#$local_hour >= 22 )); then
              action="stop"
            elif (( 10#$local_hour >= 8 && 10#$local_hour < 9 )); then
              action="start"
            else
              action="skip"
            fi
          fi

          echo "UTC time: $utc_time"
          echo "Local time ($TIME_ZONE): $local_time"
          echo "Resolved action: $action"

          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "local_time=$local_time" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        if: steps.action.outputs.action != 'skip'
        uses: hashicorp/setup-terraform@v3

      - name: Install OCI CLI
        if: steps.action.outputs.action != 'skip'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip
          pip3 install --upgrade oci-cli

      - name: Setup OCI credentials
        if: steps.action.outputs.action != 'skip'
        run: |
          ./.github/scripts/setup_oci_credentials.sh

      - name: Terraform Init
        if: steps.action.outputs.action != 'skip'
        working-directory: ${{ matrix.working_dir }}
        run: terraform init -input=false

      - name: Read infra node pool ID
        if: steps.action.outputs.action != 'skip'
        id: node_pool
        working-directory: ${{ matrix.working_dir }}
        run: |
          set -euo pipefail

          # `node_pool_id` is aliased to the infra pool (see
          # modules/oke/outputs.tf). For the functional pool, use
          # `terraform output functional_node_pool_id`.
          NODE_POOL_ID="$(terraform output -raw node_pool_id)"
          if [[ -z "$NODE_POOL_ID" ]]; then
            echo "Failed to resolve node_pool_id from Terraform output" >&2
            exit 1
          fi

          echo "node_pool_id=$NODE_POOL_ID" >> "$GITHUB_OUTPUT"

      - name: Scale node pool
        if: steps.action.outputs.action != 'skip'
        working-directory: ${{ matrix.working_dir }}
        env:
          ACTION: ${{ steps.action.outputs.action }}
          NODE_POOL_ID: ${{ steps.node_pool.outputs.node_pool_id }}
          TARGET_SIZE: ${{ matrix.normal_size }}
        run: |
          set -euo pipefail

          if [[ "$ACTION" == "stop" ]]; then
            TARGET_SIZE=0
          elif [[ "$ACTION" == "start" ]]; then
            TARGET_SIZE="$TARGET_SIZE"
          else
            echo "Unsupported action: $ACTION" >&2
            exit 1
          fi

          echo "Updating infra node pool $NODE_POOL_ID in $OCI_REGION to size $TARGET_SIZE"
          oci ce node-pool update \
            --node-pool-id "$NODE_POOL_ID" \
            --size "$TARGET_SIZE" \
            --region "$OCI_REGION" \
            --force

      - name: Job Summary
        if: always()
        env:
          REQUESTED_ACTION: ${{ github.event.inputs.action }}
        run: |
          {
            echo "## Node Pool Schedule Summary (manual fallback)"
            echo "- **Region**: ${{ matrix.region }}"
            echo "- **Timezone**: ${{ matrix.timezone }}"
            echo "- **Local time**: ${{ steps.action.outputs.local_time }}"
            echo "- **Requested action**: ${REQUESTED_ACTION:-auto}"
            echo "- **Resolved action**: ${{ steps.action.outputs.action }}"
            if [[ "${{ steps.action.outputs.action }}" != "skip" ]]; then
              echo "- **Infra node pool ID**: ${{ steps.node_pool.outputs.node_pool_id }}"
            fi
            echo ""
            echo "_Note: This workflow scales only the infra pool (1 node). The functional pool is autoscaled by an in-cluster Kubernetes CronJob._"
          } >> "$GITHUB_STEP_SUMMARY"
